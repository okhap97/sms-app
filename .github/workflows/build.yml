name: Android Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    # 이전 답변에서 발생했던 Node.js 20 Deprecation 경고를
    # 근본적으로 예방하기 위해, 워크플로가 실행되는 컨테이너 환경의 Node.js 버전을
    # 명시적으로 'node:20'으로 고정합니다.
    container:
      image: node:20 # 필요에 따라 'node:18', 'node:22' 등으로 변경 가능

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java 설치 액션을 최신 v5로 유지합니다.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Setup Gradle 액션 v4를 유지하되, 캐시 기능과 함께
      # 누락된 gradle-wrapper.jar 파일을 자동으로 다운로드하도록 설정합니다.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          # Gradle 캐시를 사용하여 빌드 속도를 향상시킵니다.
          cache-disabled: false
          # 누락된 gradle-wrapper.jar 파일을 
          # 빌드 시작 시 자동으로 다운로드하여 빌드를 진행합니다.
          # 이 설정이 빠지면 이전과 같은 'Error: gradle-wrapper.jar not found.' 에러가 발생합니다.
          gradle-wrapper-jar-disabled: false

      - name: Build APK
        run: |
          # 이 스크립트 실행 전 프로젝트 최상위에 `gradlew` 파일이
          # 실행 권한(+x)을 가지고 존재해야 합니다. 만약 실패했다면,
          # 이전 안내를 따라 `gradlew` 파일을 먼저 생성해 주세요.
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find APK files
        run: |
          echo "APK 파일 검색 시작"
          find . -type f -name "*.apk" -print

      # Artifact 업로드 액션을 최신 v4로 유지합니다.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsApp-debug
          path: '** /build/outputs/apk/debug/ *.apk' # 띄어쓰기 주의: '** /build/outputs/apk/debug/ *.apk' (붙여쓰면 마크다운 인식 안됨)
          if-no-files-found: error
